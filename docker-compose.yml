# SignGuard AI — broker only. Run: docker compose up -d
services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: signguard-broker
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
    restart: unless-stopped

volumes:
  mosquitto_data:
